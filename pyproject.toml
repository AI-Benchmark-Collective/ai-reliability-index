[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-reliability-index"
version = "0.1.0a0"
description = "Open, reproducible reliability evaluation for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "AI Benchmark Collective" }]
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.22,<5",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
airi = "airi.cli:main"

[project.urls]
Homepage = "https://github.com/AI-Benchmark-Collective/ai-reliability-index"
Issues = "https://github.com/AI-Benchmark-Collective/ai-reliability-index/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airi = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
